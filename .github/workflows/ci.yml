name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only reads the checked-out source. Keep the token least-privileged
# even if the repository's default permissions become broader later.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 26 is the repository's current test/runtime contract.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      # Read the exact Go toolchain version from agent/go.mod.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache: true
          cache-dependency-path: agent/go.sum

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run repository quality gate
        run: npm run check

      # `npm ci` installs native addons for the host Node ABI. Rebuild and load the
      # SQLCipher binding under Electron so a green unit gate cannot hide an ABI mismatch.
      - name: Verify Electron native ABI
        run: npm run rebuild && npm run test:vault
