appId: com.argus.app
productName: Argus
copyright: © Danya Kubrak
directories:
  output: dist
  buildResources: resources
# Нативный модуль уже собран под ABI Electron (electron-rebuild) — не пересобираем.
npmRebuild: false
files:
  - out/**
  - package.json
# Бинари агента трансляции: Argus заливает их на устройство по SSH при провижининге.
# Лежат распакованными рядом с приложением — иначе их не отдать в SFTP из asar.
extraResources:
  - from: resources/agent
    to: agent
    # Каталог генерируется и целиком gitignored, поэтому broad `**/*` опасен: случайный
    # debug-файл или symlink тоже уехал бы в публичный образ. Релизный набор закрытый.
    filter:
      - argus-agent-linux-amd64
      - argus-agent-linux-arm64
      - argus-agent-windows-amd64.exe
      - argus-agent-darwin-amd64
      - argus-agent-darwin-arm64
  # Каталог цен моделей: читается при первом открытии вольта, чтобы расход считался в деньгах
  # сразу и без сети. Собирается tools/build-price-catalog.mjs.
  - from: resources/ai
    to: ai
    filter: ['**/*']
  # Корень государственного УЦ Минцифры: им подписан сертификат invest-public-api.tbank.ru,
  # и в системном хранилище его нет. Используется РОВНО для запросов к этому хосту — см.
  # комментарий в src/main/tinvest.ts.
  - from: resources/ca
    to: ca
    filter: ['**/*']
# SQLCipher-биндинг должен лежать распакованным (не в asar), иначе .node не загрузится.
asarUnpack:
  - '**/*.node'
  - node_modules/better-sqlite3-multiple-ciphers/**
linux:
  target:
    - AppImage
  icon: resources/icon.png
  category: Network
  maintainer: Vadim Kubrak <archangel-gabri@users.noreply.github.com>
  desktop:
    entry:
      Name: Argus
      Comment: Personal cross-device command center
      Categories: Network;System;Utility;
appImage:
  artifactName: Argus-${version}.${ext}
